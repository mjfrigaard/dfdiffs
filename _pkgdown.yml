url: https://mjfrigaard.github.io/dfdiffs/

template:
  bootstrap: 5
  light-switch: true
  theme: arrow-light
  theme-dark: arrow-dark
  bslib:
    # 70s palette
    primary:   "#2A6F77"   # Teal, links and buttons
    secondary: "#1B2A41"   # Midnight Navy
    success:   "#5B8C5A"   # Avocado Green
    info:      "#2A6F77"   # Teal
    warning:   "#E8A33D"   # Harvest Gold
    danger:    "#B83A4B"   # Brick Red
    # light mode
    body-bg:          "#FFFFFF"   # White
    body-color:       "#3E2A1E"   # Chocolate Brown
    headings-color:   "#1B2A41"   # Midnight Navy
    link-hover-color: "#D2562B"   # Burnt Orange
    code-color:       "#B83A4B"   # Brick Red
    code-bg:          "#F9F3E1"   # Cream, softened
    navbar-light-bg:  "#F9F3E1"   # Cream, softened
    # dark mode
    body-bg-dark:          "#1B2A41"   # Midnight Navy
    body-color-dark:       "#F2E6C2"   # Cream
    link-color-dark:       "#E8A33D"   # Harvest Gold
    link-hover-color-dark: "#D2562B"   # Burnt Orange
    code-color-dark:       "#E8A33D"   # Harvest Gold
    navbar-dark-bg:        "#3E2A1E"   # Chocolate Brown
    base_font:
      google: Ubuntu
    heading_font:
      google: Fira Sans Condensed
    code_font:
      google: Ubuntu Mono

navbar:
 components:
   articles:
    text: Articles
    menu:
    - text: Comparisons
    - text: Getting Started
      href: articles/getting-started.html
    - text: New Data
      href: articles/create-new-data.html
    - text: Deleted Data
      href: articles/create-deleted-data.html
    - text: Changed/Modified Data
      href: articles/changed-modified-data.html
    - text: Creating a comparison report
      href: articles/create-comparison-report.html
    - text: PROC COMPARE parity
      href: articles/proc-compare-parity.html
    - text: -------
    - text: More Comparisons
    - text: Run all comparisons
      href: articles/compare-data.html
    - text: Multiple comparisons
      href: articles/multiple-comparisons.html
    - text: Similar work
      href: articles/similar-work.html
    - text: Uploading data (shiny app)
      href: articles/upload-data.html
    - text: -------
    - text: Development
    - text: Tests
      href: articles/tests.html

reference:
- title: Primary package functions
  desc: Find new, deleted, and changed rows, summarize the differences, and export a report.
  contents:
  - compare_data
  - compare_summary
  - compare_columns
  - create_new_data
  - create_deleted_data
  - create_changed_data
  - create_modified_data
  - create_comparison_report
  - compare_values
  - diff_values_by_key
  - print.dfdiffs_column_diff
  - print.dfdiffs_summary

- title: Utilities
  desc: Helpers for joining, selecting, and loading data.
  contents:
  - create_join_column
  - create_new_column
  - rename_join_col
  - create_empty_tbl
  - select_cols
  - anti_join_base
  - left_join_base
  - cross_tabyl
  - upload_data
  - load_flat_file
  - "`%nin%`"

- title: Shiny functions
  desc: The app, its modules, and its themes.
  contents:
  - launch_app
  - launch_app_dev
  - launch_select_demo
  - launch_upload_demo
  - app_ui
  - app_server
  - starts_with("mod_")
  - dfdiffs_fresh_theme
  - ends_with("_react_theme")

- title: Example data
  desc: Simulated datasets used in examples, vignettes, and tests.
  contents:
  - has_keyword("datasets")
