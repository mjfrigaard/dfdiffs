url: https://mjfrigaard.github.io/dfdiffs/

template:
  bootstrap: 5
  light-switch: true
  theme: a11y-light
  theme-dark: a11y-dark
  bslib:
    # light mode
    body-bg:    "#FBF7EE"   # paper (cream tint)
    body-color: "#3E2A1E"   # chocolate brown
    primary:    "#2A6F77"   # teal: links, buttons
    secondary:  "#6B5A4C"   # muted brown
    success:    "#4A7A49"   # avocado (darkened for text)
    info:       "#2A6F77"   # teal
    warning:    "#E8A33D"   # harvest gold
    danger:     "#B83A4B"   # brick red
    navbar-bg:  "#1B2A41"   # midnight navy (both modes)
    code-color: "#8F3A18"   # burnt orange (darkened)
    border-color: "#E4D8B8"
    body-secondary-bg: "#F4ECD6"
    body-tertiary-bg:  "#F7F1E2"
    # dark mode
    body-bg-dark:    "#141E2E"
    body-color-dark: "#EDE3C8"
    body-secondary-bg-dark: "#1B2A41"
    body-tertiary-bg-dark:  "#1F2D44"
    border-color-dark: "#2E3F5C"
    link-color-dark:       "#7FBFC6"
    link-hover-color-dark: "#E8A33D"
    code-color-dark: "#F0B865"
    base_font:
      google: IBM Plex Sans
    heading_font:
      google: IBM Plex Sans Condensed
    code_font:
      google: IBM Plex Mono

navbar:
 components:
   articles:
    text: Articles
    menu:
    - text: Comparisons
    - text: Getting Started
      href: articles/getting-started.html
    - text: New Data
      href: articles/create-new-data.html
    - text: Deleted Data
      href: articles/create-deleted-data.html
    - text: Changed/Modified Data
      href: articles/changed-modified-data.html
    - text: Creating a comparison report
      href: articles/create-comparison-report.html
    - text: PROC COMPARE parity
      href: articles/proc-compare-parity.html
    - text: -------
    - text: More Comparisons
    - text: Run all comparisons
      href: articles/compare-data.html
    - text: Multiple comparisons
      href: articles/multiple-comparisons.html
    - text: Similar work
      href: articles/similar-work.html
    - text: Uploading data (shiny app)
      href: articles/upload-data.html
    - text: -------
    - text: Development
    - text: Tests
      href: articles/tests.html

reference:
- title: Primary package functions
  desc: Find new, deleted, and changed rows, summarize the differences, and export a report.
  contents:
  - compare_data
  - compare_summary
  - compare_columns
  - create_new_data
  - create_deleted_data
  - create_changed_data
  - create_modified_data
  - create_comparison_report
  - compare_values
  - diff_values_by_key
  - print.dfdiffs_column_diff
  - print.dfdiffs_summary

- title: Utilities
  desc: Helpers for joining, selecting, and loading data.
  contents:
  - create_join_column
  - create_new_column
  - rename_join_col
  - create_empty_tbl
  - select_cols
  - anti_join_base
  - left_join_base
  - cross_tabyl
  - upload_data
  - load_flat_file
  - "`%nin%`"

- title: Shiny functions
  desc: The app, its modules, and its themes.
  contents:
  - launch_app
  - launch_app_dev
  - launch_select_demo
  - launch_upload_demo
  - app_ui
  - app_server
  - starts_with("mod_")
  - dfdiffs_fresh_theme
  - ends_with("_react_theme")

- title: Example data
  desc: Simulated datasets used in examples, vignettes, and tests.
  contents:
  - has_keyword("datasets")
